version: 2
updates:
  # GitHub Actions only. The gradle ecosystem is deliberately not enabled:
  # bcprov-lts8on is an api dependency on the Java 8 LTS line and equalsverifier
  # 4.x requires Java 17, so automated bumps would either change our published
  # transitive surface or fail against sourceCompatibility 1.8.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]
